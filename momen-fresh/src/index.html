<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مؤمن فريش | كاشير المحل</title><meta name="theme-color" content="#063b31"><meta name="description" content="كاشير مؤمن فريش وأسعار يومية وحسابات بالدينار الأردني"><link rel="manifest" href="/manifest.json"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23063b31'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23dcf763'%3Eم%3C/text%3E%3C/svg%3E"><style>
:root{--green:#063b31;--lime:#dcf763;--bg:#f2f5f7;--ink:#172b29;--muted:#59706a;--border:#dbe5e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.65}button,input,select{font:inherit}button,a.btn{cursor:pointer;border:1px solid var(--border);border-radius:9px;padding:10px 16px;background:white;color:var(--ink);text-decoration:none}button:hover,a.btn:hover{border-color:var(--green);background:#f2f8ef}button.primary{background:var(--green);color:white;border:0;font-weight:bold}button.primary:hover{background:#125f4d}button.accent{background:var(--lime);color:var(--green);font-weight:bold;border:0}button.danger{color:#b33737}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #bfccc6;background:white;color:var(--ink);padding:10px;border-radius:8px;min-width:0;width:100%}input[type=number]{direction:ltr;text-align:right}input:focus,select:focus{outline:2px solid #8ebf52;outline-offset:1px}label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}h1,h2,h3,p{margin:0}h2{font-size:24px;line-height:1.5}h3{font-size:18px}.muted{color:var(--muted);font-size:14px}.top{background:var(--green);color:white;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--lime);color:var(--green);border-radius:12px;font-weight:bold;font-size:27px;width:48px;text-align:center}.top h1{font-size:25px}.top small{color:#c6d7d1}.status{background:#ffffff12;border:1px solid #ffffff35;border-radius:8px;padding:8px 12px;font-size:14px;max-width:500px}.shell{max-width:1600px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}nav button{padding:12px 20px;font-weight:bold}nav button.active{background:var(--green);color:white}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.tag{color:var(--green);font-size:14px;background:#e1edbd;padding:4px 10px;border-radius:6px}.panel{background:white;border:1px solid var(--border);border-radius:14px;padding:22px}.grid{display:grid;gap:20px;grid-template-columns:1.4fr 1fr}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}.fields.two{grid-template-columns:1fr 1fr}.fieldfull{grid-column:1/-1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:18px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.product{text-align:right;min-height:112px;border-radius:12px;position:relative;padding:16px;background:#fafcfb}.product strong{display:block;font-size:19px}.product .price{color:var(--green);font-size:20px;font-weight:bold;margin-top:6px}.product .muted{font-size:13px}.product:disabled{background:#f3f4f4}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric{background:white;border:1px solid var(--border);padding:20px;border-radius:12px}.metric b{display:block;font-size:27px;direction:ltr;text-align:right;line-height:1.4}.metric.emph{background:var(--green);color:white}.metric.emph .muted{color:#d1e1d9}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:right;white-space:nowrap}th{font-size:14px;color:var(--muted);background:#f4f7f5}td,th{padding:12px 10px;border-bottom:1px solid var(--border)}td input{width:112px}.total{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-top:1px solid var(--border);margin-top:16px}.total b{font-size:33px;color:var(--green);direction:ltr}.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;margin:15px 0}.notice{padding:12px 16px;background:#fff8d8;border:1px solid #eedba2;border-radius:9px;font-size:14px;margin-bottom:18px}.good{background:#eef8e7;border-color:#c7dfb8}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.money{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.small{font-size:14px}.spacer{margin-top:20px}.hidden{display:none!important}dialog{max-width:580px;width:calc(100% - 32px);border:1px solid var(--border);border-radius:16px;padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#062b2588}dialog .fields{margin-top:20px}.toast{position:fixed;bottom:24px;left:24px;right:24px;max-width:600px;margin:auto;background:var(--green);color:white;border-radius:12px;padding:16px;z-index:20;box-shadow:0 10px 30px #0002}.receipt{display:none}footer{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 0}.pill{font-size:13px;padding:3px 8px;border-radius:5px;background:#edf3ef}.bad{color:#a13030}.widebtn{width:100%;padding:16px!important;font-size:18px}.settingslinks a{color:var(--green)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:14px}.top{padding:16px}.catalog{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr 1fr}.panel{padding:16px}nav button{flex:1;padding:10px}.metric{padding:14px}.metric b{font-size:22px}.fields.two{grid-template-columns:1fr}.status{width:100%}}@media print{body>*{display:none!important}body>.receipt{display:block!important;background:white;padding:0;font-size:14px;color:black}.receipt h1{text-align:center;font-size:24px}.receipt table{white-space:normal}.receipt td,.receipt th{padding:6px 2px;font-size:12px}.receipt p{text-align:center}.receipt .total b{font-size:24px;color:black}@page{margin:7mm}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">م</div><div><h1>مؤمن فريش</h1><small>خضار وفواكه · الدينار الأردني</small></div></div><div class="row"><span id="dateNow"></span><span class="status" id="syncStatus">البيانات محفوظة على هذا الجهاز</span><button class="accent" id="syncBtn" onclick="syncCloud()">مزامنة الآن</button></div></header>
<main class="shell"><nav id="nav"></nav><div id="view"></div><footer>مؤمن فريش · مبالغ بثلاث خانات عشرية · قراءة الوزن يدويًا لحين ربط الميزان</footer></main>
<dialog id="dlg"><div id="dialogBody"></div></dialog><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><div class="receipt" id="receipt"></div>
<script>/*CORE*/</script><script>
'use strict';
const KEY='momen-fresh-v1',META='momen-fresh-sync-v1';let state,meta={etag:null,dirty:false,lastSync:null,syncedRevision:0},cart=[],tab='pos',search='',chosenDate=MF.day(),lastReceipt=null,syncBusy=false,conflict=false,localBlocked=false,dirHandle=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),m=v=>(v/1000).toFixed(3),q=v=>(v/1000).toFixed(3).replace(/\.?0+$/,''),unit=p=>p.unit==='kg'?'كغ':'حبة',payNames={cash:'نقدي',visa:'فيزا',master:'ماستر كارد',talabat:'طلبات'},tabs={pos:'الكاشير',prices:'الأسعار والأصناف',stock:'المشتريات والتالف',expenses:'المصاريف',reports:'التقارير والفواتير',backup:'الحفظ والنسخ الاحتياطية'};
try{const saved=localStorage.getItem(KEY);state=saved?MF.validate(JSON.parse(saved)):MF.fresh();meta=JSON.parse(localStorage.getItem(META)||'null')||meta;meta.dirty=meta.dirty||state.revision!==(meta.syncedRevision||0);localStorage.setItem(KEY,JSON.stringify(state));}catch(e){state=MF.fresh();localBlocked=true;}
function toast(text,error=false){$('toast').textContent=text;$('toast').style.background=error?'#9b3131':'#063b31';$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),5000);}
function saveMeta(){try{localStorage.setItem(META,JSON.stringify(meta));}catch(e){toast('تعذر حفظ حالة المزامنة؛ صدّر نسخة احتياطية',true);}}
function transact(fn){try{MF.need(!localBlocked,'تعذر فتح بيانات الجهاز. استعد نسخة احتياطية أو افتح البرنامج من متصفح يدعم التخزين.');MF.need(!conflict,'يوجد تعارض مع النسخة السحابية؛ صدّر بيانات الجهاز ثم اختر النسخة التي تريد اعتمادها');const disk=JSON.parse(localStorage.getItem(KEY)||'null');MF.need(!disk||disk.revision===state.revision,'البرنامج مفتوح في نافذة أخرى؛ أعد تحميل الصفحة');const next=structuredClone(state);const result=fn(next);next.revision++;next.updatedAt=new Date().toISOString();MF.validate(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;meta.dirty=true;saveMeta();render();status();backupToFolder().catch(()=>{});clearTimeout(window.syncTimer);window.syncTimer=setTimeout(()=>syncCloud(),1500);return result||true;}catch(e){toast(e.message||'لم يتم الحفظ',true);return false;}}
function status(){let text=localBlocked?'تعذر فتح التخزين المحلي؛ البيع متوقف':conflict?'تعارض مزامنة؛ بيانات الجهاز محفوظة':location.protocol==='file:'?'نسخة محلية · الحفظ السحابي متاح من رابط البرنامج':meta.dirty?'محفوظ على الجهاز · بانتظار المزامنة':meta.lastSync?'تم الحفظ سحابيًا '+new Date(meta.lastSync).toLocaleTimeString('ar-JO',{hour:'2-digit',minute:'2-digit'}):'البيانات محفوظة على هذا الجهاز';if(!navigator.onLine)text+=' · دون إنترنت';$('syncStatus').textContent=text;$('syncBtn').disabled=syncBusy||location.protocol==='file:';}
function setTab(t){tab=t;render();}
function render(){const before=document.activeElement?.id;$('dateNow').textContent=new Intl.DateTimeFormat('ar-JO',{timeZone:'Asia/Amman',weekday:'long',month:'short',day:'numeric'}).format(new Date());$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('');$('view').innerHTML=({pos:posView,prices:priceView,stock:stockView,expenses:expenseView,reports:reportView,backup:backupView}[tab])();if(localBlocked)$('view').insertAdjacentHTML('afterbegin','<div class="notice">تعذر فتح بيانات الجهاز. لن تُستبدل البيانات الموجودة. افتح الحفظ والنسخ الاحتياطية لاستيراد نسخة صحيحة.</div>');status();}
const title=(a,b='')=>`<div class="titlebar"><h2>${a}</h2>${b}</div>`;
const selectProducts=(id)=>`<select id="${id}" required><option value="">اختر الصنف</option>${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${unit(p)})</option>`).join('')}</select>`;
const paymentSelect=(id,includeTalabat=false)=>`<select id="${id}" ${includeTalabat?'onchange="paymentChanged()"':''}>${Object.entries(payNames).filter(([k])=>includeTalabat||k!=='talabat').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`;
function posView(){const stale=state.products.filter(p=>p.priceDate!==MF.day()&&p.stock>0);return title('كاشير البيع','<span class="tag">الوزن يدويًا · مثال: 1.250 كغ</span>')+(stale.length?`<div class="notice">${stale.length} أصناف لها أسعار من أيام سابقة. راجع الأسعار أو أكّد استمرارها قبل البيع. <button onclick="setTab('prices')">فتح الأسعار</button></div>`:'')+`<div class="grid"><section class="panel"><div class="row"><input id="productSearch" placeholder="ابحث عن صنف…" aria-label="بحث الأصناف" value="${esc(search)}" oninput="search=this.value;updateCatalog()"><button onclick="productDialog()">إضافة صنف</button></div><div class="catalog" id="catalog">${catalogHTML()}</div>${state.products.length?'':'<div class="empty"><h3>أضف أصناف المحل أولًا</h3><p>ثم سجّل المخزون وتكلفته في المشتريات لتبدأ البيع.</p></div>'}</section><section class="panel"><div class="titlebar"><h3>الفاتورة الحالية</h3><button class="danger" onclick="clearCart()">تفريغ</button></div><div id="cartArea">${cartHTML()}</div><div class="fields two"><div><label for="payment">طريقة الدفع</label>${paymentSelect('payment',true)}</div><div><label for="feePct">عمولة الدفع / طلبات %</label><input id="feePct" type="number" min="0" max="100" step="0.01" value="0" oninput="updateTotals()"></div><div class="fieldfull"><label for="reference">رقم طلبات أو مرجع العملية (اختياري)</label><input id="reference" maxlength="100" placeholder="رقم الطلب أو إيصال الدفع"></div></div><p class="muted spacer">تُسجّل البطاقة هنا بعد نجاح الدفع على جهاز البنك. طلبات يُسجّل يدويًا والعمولة تُخصم من صافي المستحق.</p><div class="total"><span>الإجمالي</span><b id="cartTotal">${m(cart.reduce((a,l)=>a+Math.round(l.q*l.price/1000),0))} <small>د.أ</small></b></div><p class="muted" id="cartNet"></p><button class="primary widebtn" onclick="completeSale()" ${!cart.length?'disabled':''}>حفظ فاتورة البيع</button>${lastReceipt?'<button class="widebtn spacer" onclick="printReceipt(lastReceipt)">طباعة آخر فاتورة</button>':''}</section></div>`;}
function catalogHTML(){return state.products.filter(p=>p.name.includes(search.trim())).map(p=>`<button class="product" onclick="addCartDialog('${p.id}')" ${!p.stock?'disabled':''}><strong>${esc(p.name)}</strong><div class="price">${m(p.price)} <span class="small">د.أ / ${unit(p)}</span></div><div class="muted">المتوفر ${q(p.stock)} ${unit(p)} · ${p.priceDate===MF.day()?'سعر اليوم':'آخر سعر '+esc(p.priceDate)}</div></button>`).join('');}
function updateCatalog(){$('catalog').innerHTML=catalogHTML();}
function cartHTML(){return cart.length?`<div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>المبلغ</th><th></th></tr></thead><tbody>${cart.map((l,i)=>`<tr><td>${esc(l.name)}<div class="muted">${m(l.price)} / ${l.unit==='kg'?'كغ':'حبة'}</div></td><td><input type="number" aria-label="كمية ${esc(l.name)}" value="${l.q/1000}" min="${l.unit==='kg'?'.001':'1'}" step="${l.unit==='kg'?'.001':'1'}" onchange="editCart(${i},this.value)"></td><td><span class="money">${m(Math.round(l.q*l.price/1000))}</span></td><td><button class="danger" aria-label="حذف ${esc(l.name)}" onclick="cart.splice(${i},1);refreshCart()">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">اختر الصنف وأدخل الوزن لإضافته للفاتورة</div>';}
function refreshCart(){const payment=$('payment')?.value||'cash',pct=$('feePct')?.value||0,ref=$('reference')?.value||'';render();$('payment').value=payment;$('feePct').value=pct;$('reference').value=ref;updateTotals();}
function updateTotals(){const t=cart.reduce((a,l)=>a+Math.round(l.q*l.price/1000),0);$('cartTotal').innerHTML=`${m(t)} <small>د.أ</small>`;const pct=Number($('feePct').value);$('cartNet').textContent=`العمولة: ${m(Math.round(t*pct/100))} د.أ · صافي المستحق: ${m(t-Math.round(t*pct/100))} د.أ`;}
function paymentChanged(){const k=$('payment').value;$('feePct').value=k==='talabat'?state.settings.talabatPct:k==='cash'?0:state.settings.cardPct;updateTotals();}
function openDialog(html){$('dialogBody').innerHTML=html;$('dlg').showModal();}
function closeDialog(){$('dlg').close();}
function addCartDialog(id){const p=state.products.find(x=>x.id===id);openDialog(`<h2>${esc(p.name)}</h2><p class="muted">${m(p.price)} د.أ / ${unit(p)} · المخزون ${q(p.stock)}</p><form onsubmit="event.preventDefault();addCart('${id}')"><div class="spacer"><label for="addQty">${p.unit==='kg'?'الوزن بالكيلو':'عدد الحبات'}</label><input id="addQty" type="number" required min="${p.unit==='kg'?'.001':'1'}" step="${p.unit==='kg'?'.001':'1'}" value="1" autofocus></div><div class="actions"><button class="primary">إضافة للفاتورة</button><button type="button" onclick="closeDialog()">إلغاء</button></div></form>`);}
function addCart(id){try{const p=state.products.find(x=>x.id===id),amount=MF.qty($('addQty').value),old=cart.find(x=>x.productId===id);MF.need(amount>0&&(p.unit==='kg'||amount%1000===0),'أدخل كمية صحيحة');MF.need(amount+(old?.q||0)<=p.stock,'المخزون لا يكفي');if(old){MF.need(old.price===p.price,'حذف الصنف من الفاتورة ثم إضافته يعتمد السعر الجديد');old.q+=amount;}else cart.push({productId:id,name:p.name,unit:p.unit,q:amount,price:p.price});closeDialog();refreshCart();}catch(e){toast(e.message,true);}}
function editCart(i,value){const n=MF.qty(value),p=state.products.find(x=>x.id===cart[i].productId);if(n>0&&n<=p.stock&&(p.unit==='kg'||n%1000===0))cart[i].q=n;else toast('الكمية غير صحيحة أو أكبر من المخزون',true);refreshCart();}
function clearCart(){if(cart.length&&!confirm('تفريغ الفاتورة الحالية؟'))return;cart=[];render();}
function completeSale(){const payment=$('payment').value,pct=Number($('feePct').value),ref=$('reference').value;const stale=cart.some(l=>state.products.find(p=>p.id===l.productId).priceDate!==MF.day());if(stale&&!confirm('بعض الأسعار لم تُحدّث اليوم. هل تعتمد الأسعار الظاهرة لهذه الفاتورة؟'))return;const sale=transact(s=>MF.sell(s,cart,payment,pct,ref));if(sale){lastReceipt=sale;cart=[];render();toast('تم حفظ الفاتورة رقم '+sale.number);}}
function productDialog(){openDialog(`<h2>إضافة صنف</h2><form onsubmit="event.preventDefault();createProduct()"><div class="fields two"><div><label for="newName">اسم الصنف</label><input id="newName" required maxlength="80" placeholder="مثال: بندورة"></div><div><label for="newUnit">الوحدة</label><select id="newUnit"><option value="kg">كيلو</option><option value="piece">حبة</option></select></div><div><label for="newPrice">سعر البيع بالدينار</label><input id="newPrice" type="number" required min="0" step=".001"></div></div><p class="muted spacer">بعد إضافة الصنف سجّل كميته وتكلفته في المشتريات. كل البيانات تبدأ دون مبيعات تجريبية.</p><div class="actions"><button class="primary">حفظ الصنف</button><button type="button" onclick="closeDialog()">إلغاء</button></div></form>`);}
function createProduct(){if(transact(s=>MF.addProduct(s,$('newName').value,$('newUnit').value,MF.money($('newPrice').value)))){closeDialog();toast('تم إضافة الصنف');}}
function priceView(){return title('أسعار اليوم والأصناف','<button class="primary" onclick="productDialog()">إضافة صنف</button>')+`<div class="notice good">غيّر أسعار البيع ثم احفظها مرة واحدة. ستُحفظ أسعار الفواتير السابقة كما كانت، ويمكن تأكيد الأسعار الحالية لليوم دون تغييرها.</div><div class="panel">${state.products.length?`<form onsubmit="event.preventDefault();savePrices()"><div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>سعر البيع د.أ</th><th>آخر تحديث</th><th>المخزون</th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${unit(p)}</td><td><input id="price-${p.id}" aria-label="سعر ${esc(p.name)}" type="number" step=".001" min="0" required value="${m(p.price)}"></td><td>${esc(p.priceDate)}</td><td>${q(p.stock)}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="primary">حفظ واعتماد أسعار اليوم</button></div></form>`:'<div class="empty">لا توجد أصناف بعد</div>'}</div>`;}
function savePrices(){const prices=state.products.map(p=>({id:p.id,price:MF.money($('price-'+p.id).value)}));if(transact(s=>{for(const x of prices){MF.need(Number.isSafeInteger(x.price)&&x.price>=0,'سعر غير صالح');const p=s.products.find(p=>p.id===x.id);p.price=x.price;p.priceDate=MF.day();}}))toast('تم اعتماد أسعار اليوم');}
function stockView(){return title('المشتريات والمخزون')+`<div class="grid"><section class="panel"><h3>إضافة بضاعة / مخزون افتتاحي</h3><p class="muted">أدخل التكلفة الإجمالية الفعلية لهذه الكمية. يُحسب الربح بمتوسط تكلفة المخزون.</p><form onsubmit="event.preventDefault();savePurchase()"><div class="fields two spacer"><div><label for="buyProduct">الصنف</label>${selectProducts('buyProduct')}</div><div><label for="buyQty">الكمية بالكيلو أو الحبة</label><input id="buyQty" required type="number" min=".001" step=".001"></div><div><label for="buyTotal">إجمالي تكلفة الكمية د.أ</label><input id="buyTotal" required type="number" min=".001" step=".001"></div><div><label for="buyPayment">دفع المشتريات</label>${paymentSelect('buyPayment')}</div><div class="fieldfull"><label for="supplier">المورد / ملاحظة</label><input id="supplier" maxlength="100"></div></div><div class="actions"><button class="primary">حفظ المشتريات</button></div></form></section><section class="panel"><h3>تسجيل التالف</h3><p class="muted">تُخصم الكمية من المخزون وتُسجّل تكلفتها ضمن خسارة التالف.</p><form onsubmit="event.preventDefault();saveWaste()"><div class="fields two spacer"><div><label for="wasteProduct">الصنف</label>${selectProducts('wasteProduct')}</div><div><label for="wasteQty">الكمية التالفة</label><input id="wasteQty" required type="number" min=".001" step=".001"></div><div class="fieldfull"><label for="wasteNote">السبب</label><input id="wasteNote" maxlength="100"></div></div><div class="actions"><button class="danger">تسجيل التالف</button></div></form></section></div><section class="panel spacer"><h3>المخزون المتوفر</h3><div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>متوسط تكلفة الوحدة د.أ</th><th>قيمة المخزون بالتكلفة د.أ</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${q(p.stock)} ${unit(p)}</td><td>${p.stock?m(Math.round(p.value*1000/p.stock)):'—'}</td><td>${m(p.value)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel spacer"><h3>آخر المشتريات</h3>${ledger(state.purchases.slice(-25).reverse(),r=>[r.date,r.name,q(r.q),m(r.total),payNames[r.payment],r.supplier],['التاريخ','الصنف','الكمية','التكلفة د.أ','الدفع','المورد'])}</section>`;}
function savePurchase(){const a=[$('buyProduct').value,MF.qty($('buyQty').value),MF.money($('buyTotal').value),$('buyPayment').value,$('supplier').value];if(transact(s=>MF.buy(s,...a)))toast('تم حفظ المشتريات وتحديث المخزون');}
function saveWaste(){const a=[$('wasteProduct').value,MF.qty($('wasteQty').value),$('wasteNote').value];if(transact(s=>MF.waste(s,...a)))toast('تم تسجيل التالف');}
function ledger(rows,values,heads){return rows.length?`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد عمليات مسجلة</div>';}
function expenseView(){return title('مصاريف المحل')+`<section class="panel"><form onsubmit="event.preventDefault();saveExpense()"><div class="fields"><div><label for="expenseNote">وصف المصروف</label><input id="expenseNote" required maxlength="100" placeholder="أجرة، كهرباء، نقل…"></div><div><label for="expenseTotal">المبلغ بالدينار</label><input id="expenseTotal" type="number" required min=".001" step=".001"></div><div><label for="expensePayment">طريقة الدفع</label>${paymentSelect('expensePayment')}</div></div><div class="actions"><button class="primary">حفظ المصروف</button></div></form></section><section class="panel spacer"><h3>سجل المصاريف</h3>${ledger(state.expenses.slice().reverse(),r=>[r.date,r.note,m(r.total),payNames[r.payment]],['التاريخ','الوصف','المبلغ د.أ','الدفع'])}</section>`;}
function saveExpense(){const note=$('expenseNote').value.trim(),total=MF.money($('expenseTotal').value),payment=$('expensePayment').value;if(transact(s=>{MF.need(note&&total>0,'أدخل وصفًا ومبلغًا صحيحًا');s.expenses.push({id:MF.id(),date:MF.day(),note,total,payment});}))toast('تم حفظ المصروف');}
function reportView(){const r=MF.report(state,chosenDate);return title('التقارير والفواتير',`<div class="row"><label for="reportDate">اليوم</label><input id="reportDate" style="width:auto" type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()"><button onclick="exportCSV()">تصدير CSV</button></div>`)+`<div class="metrics"><div class="metric"><span class="muted">المبيعات د.أ</span><b>${m(r.sales)}</b><span class="muted">${r.rows.length} فاتورة</span></div><div class="metric emph"><span class="muted">الربح بعد المصاريف والتالف د.أ</span><b>${m(r.profit)}</b><span class="muted">بعد تكلفة البضاعة والعمولات</span></div><div class="metric"><span class="muted">المصاريف والتالف د.أ</span><b>${m(r.expenses+r.waste)}</b><span class="muted">المصاريف ${m(r.expenses)} · التالف ${m(r.waste)}</span></div><div class="metric"><span class="muted">صافي حركة النقد د.أ</span><b>${m(r.cash)}</b><span class="muted">لا يشمل رصيد بداية الصندوق</span></div></div><div class="metrics">${Object.entries(payNames).map(([k,v])=>`<div class="metric"><span class="muted">مبيعات ${v} د.أ</span><b>${m(r.totals[k])}</b></div>`).join('')}</div><div class="notice">تكلفة البضاعة المباعة ${m(r.cost)} د.أ · العمولات ${m(r.fees)} د.أ · مشتريات اليوم ${m(r.purchases)} د.أ · المخزون الحالي بالتكلفة ${m(r.inventory)} د.أ. المشتريات لا تُخصم كلها من الربح؛ تُخصم تكلفة ما تم بيعه فقط.</div><section class="panel"><h3>فواتير ${chosenDate}</h3><div class="tablewrap"><table><thead><tr><th>رقم</th><th>الدفع</th><th>الإجمالي د.أ</th><th>العمولة</th><th>الصافي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${state.sales.filter(x=>x.date===chosenDate).slice().reverse().map(x=>`<tr><td>#${x.number}<div class="muted">${esc(x.reference)}</div></td><td>${payNames[x.payment]}</td><td>${m(x.total)}</td><td>${m(x.fee)}</td><td>${m(x.net)}</td><td>${x.voided?'ملغاة':'محفوظة'}</td><td><button onclick="printById('${x.id}')">طباعة</button> ${!x.voided&&x.date===MF.day()?`<button class="danger" onclick="voidById('${x.id}')">إلغاء</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد فواتير لهذا اليوم</td></tr>'}</tbody></table></div></section><section class="panel spacer"><div class="titlebar"><h3>مستحقات طلبات غير المحوّلة</h3><span class="tag">${m(r.due)} د.أ · جميع الأيام</span></div><div class="tablewrap"><table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>رقم الطلب</th><th>الصافي د.أ</th><th>التسوية</th></tr></thead><tbody>${state.sales.filter(x=>!x.voided&&x.payment==='talabat'&&!state.settlements.some(t=>t.saleId===x.id)).map(x=>`<tr><td>#${x.number}</td><td>${x.date}</td><td>${esc(x.reference)}</td><td>${m(x.net)}</td><td><button onclick="settle('${x.id}')">تأكيد وصول المبلغ</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مستحقات معلقة</td></tr>'}</tbody></table></div><p class="muted spacer">التسوية تخص مبلغًا وصل للحساب البنكي، ولا تُحسب كمبيعات جديدة أو نقد داخل الصندوق.</p></section>`;}
function settle(id){const sale=state.sales.find(x=>x.id===id);if(!confirm('تأكيد استلام صافي '+m(sale.net)+' د.أ من طلبات لهذه الفاتورة؟'))return;if(transact(s=>{MF.need(!s.settlements.some(x=>x.saleId===id),'تمت التسوية مسبقًا');s.settlements.push({id:MF.id(),date:MF.day(),saleId:id,total:sale.net});}))toast('تم تسجيل وصول مستحق طلبات');}
function voidById(id){if(!confirm('إلغاء الفاتورة وإعادة كميتها إلى المخزون؟ نفّذ رد المبلغ على جهاز الدفع إن لزم.'))return;if(transact(s=>MF.voidSale(s,id)))toast('تم إلغاء الفاتورة');}
function printById(id){printReceipt(state.sales.find(x=>x.id===id));}
function printReceipt(s){$('receipt').innerHTML=`<h1>مؤمن فريش</h1><p>خضار وفواكه</p><p>فاتورة #${s.number} ${s.voided?'— ملغاة':''}</p><p>${esc(s.date)} · ${new Date(s.time).toLocaleTimeString('ar-JO')} · ${payNames[s.payment]}</p>${s.reference?`<p>المرجع: ${esc(s.reference)}</p>`:''}<table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>المبلغ</th></tr></thead><tbody>${s.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${q(l.q)} ${l.unit==='kg'?'كغ':'حبة'}</td><td>${m(l.price)}</td><td>${m(l.total)}</td></tr>`).join('')}</tbody></table><div class="total"><span>الإجمالي د.أ</span><b>${m(s.total)}</b></div><p>شكرًا لزيارتكم</p>`;window.print();}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);}
function exportBackup(){download('Momen-Fresh-'+MF.day()+'-'+Date.now()+'.json',JSON.stringify(state,null,2));toast('تم تنزيل نسخة الحسابات');}
function exportCSV(){const r=MF.report(state,chosenDate),rows=[['الرقم','التاريخ','الدفع','الإجمالي د.أ','العمولة د.أ','الصافي د.أ','التكلفة د.أ','المرجع'],...r.rows.map(s=>[s.number,s.date,payNames[s.payment],m(s.total),m(s.fee),m(s.net),m(s.cost),s.reference])];const safe=v=>{let t=String(v);if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};download('Momen-Fresh-sales-'+chosenDate+'.csv','\ufeff'+rows.map(row=>row.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function backupView(){return title('الحفظ والنسخ الاحتياطية')+`<div class="grid"><section class="panel stack"><h3>نسخة حسابات المحل</h3><p>احتفظ بنسخة مستقلة من الفواتير والمخزون والأسعار والمصاريف. الاستعادة تستبدل بيانات هذا الجهاز بعد تأكيدك.</p><div class="actions"><button class="primary" onclick="exportBackup()">تنزيل نسخة الحسابات JSON</button><button onclick="$('restoreFile').click()">استعادة نسخة</button><input class="hidden" id="restoreFile" type="file" accept=".json,application/json" onchange="restoreBackup(this.files[0])"></div><div class="notice">آخر حفظ محلي: ${esc(new Date(state.updatedAt).toLocaleString('ar-JO'))}<br>آخر مزامنة سحابية: ${meta.lastSync?esc(new Date(meta.lastSync).toLocaleString('ar-JO')):'لم تتم بعد'}<br>${meta.dirty?'توجد تغييرات تنتظر المزامنة':'لا توجد تغييرات معلقة'}</div><h3>Cloudflare</h3><p class="muted">يُحفظ الحساب كاملًا على السحابة مع نسخة أرشيفية لكل مزامنة ناجحة. البيع يستمر محليًا وقت انقطاع الإنترنت. استخدم جهاز كاشير واحدًا لتجنب التعارض.</p><div class="actions"><button onclick="syncCloud()">مزامنة الآن</button><button onclick="recoverCloud()">استعادة النسخة السحابية</button></div><div id="cloudHistory"></div><button onclick="loadCloudHistory()">عرض نسخ المزامنة السابقة</button></section><section class="panel stack"><h3>Google Drive</h3><p>لنسخ الحسابات تلقائيًا: ثبّت Google Drive على كمبيوتر المحل، وافتح البرنامج في Chrome أو Edge، ثم اختر مجلدًا داخله لحفظ النسخ.</p><div class="actions"><button class="primary" onclick="pickFolder()">اختيار مجلد النسخ التلقائية</button><button onclick="backupToFolder(true)">حفظ نسخة في المجلد</button></div><p class="muted" id="folderStatus">${dirHandle?'المجلد المختار: '+esc(dirHandle.name):'لم يُربط مجلد على هذا الجهاز بعد'}</p><p class="muted">تُحفظ نسخة لكل يوم بعد كل عملية. تتم مزامنتها إلى Drive عبر برنامج Google Drive عند عودة الإنترنت. فتح الرابط وحده لا يفعّل هذا الربط.</p><div class="settingslinks"><a href="https://drive.google.com/drive/folders/104ivgHhGSg-yAJlBXlg3-x_LHhhzjbXc" target="_blank" rel="noopener">فتح مجلد مؤمن فريش على Drive</a></div><h3>عمولات الدفع الافتراضية</h3><form onsubmit="event.preventDefault();saveSettings()"><div class="fields two"><div><label for="talabatPct">عمولة طلبات %</label><input id="talabatPct" type="number" min="0" max="100" step=".01" value="${state.settings.talabatPct}" required></div><div><label for="cardPct">عمولة البطاقات %</label><input id="cardPct" type="number" min="0" max="100" step=".01" value="${state.settings.cardPct}" required></div></div><p class="muted spacer">ابدأ بنسبة عقدك الفعلية. النسبة الحالية 0 حتى تدخلها، ويمكن تعديل العمولة لكل فاتورة.</p><div class="actions"><button class="primary">حفظ الإعدادات</button></div></form><h3>تشغيل دون إنترنت</h3><p class="muted" id="offlineStatus">${location.protocol==='file:'?'هذا الملف يعمل محليًا دون اتصال. المزامنة السحابية تتم من الرابط المنشور.':'افتح البرنامج مرة مع الإنترنت وانتظر جاهزية النسخة دون اتصال. يبقى هذا الجهاز المصدر أثناء الانقطاع.'}</p><button onclick="downloadApp()">تنزيل البرنامج للاستخدام المحلي</button></section></div>`;}
function saveSettings(){const t=Number($('talabatPct').value),c=Number($('cardPct').value);if(transact(s=>{s.settings={talabatPct:t,cardPct:c};}))toast('تم حفظ العمولات الافتراضية');}
async function restoreBackup(file){if(!file)return;try{MF.need(file.size<=8000000,'الملف أكبر من الحد المتاح');const next=MF.validate(JSON.parse(await file.text()));MF.need(confirm('سيتم استبدال الحسابات على هذا الجهاز بملف فيه '+next.sales.length+' فاتورة. نزّل نسخة من بياناتك الحالية أولًا. هل تتابع؟'),'تم إلغاء الاستعادة');next.revision=Math.max(state.revision,next.revision)+1;next.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(next));state=next;localBlocked=false;conflict=false;cart=[];meta.dirty=true;saveMeta();render();toast('تمت الاستعادة محليًا؛ زامن لحفظها سحابيًا');}catch(e){toast(e.message,true);}}
async function syncCloud(){if(syncBusy||location.protocol==='file:'||!navigator.onLine||localBlocked||conflict)return;syncBusy=true;status();try{const get=await fetch('/api/state',{cache:'no-store',redirect:'error'});MF.need(get.ok,'تعذر الوصول للسحابة؛ البيانات محفوظة على الجهاز. افتح الرابط وسجّل الدخول ثم أعد المحاولة');const remote=await get.json();if(!meta.dirty){if(remote.state){const cloud=MF.validate(remote.state);localStorage.setItem(KEY,JSON.stringify(cloud));state=cloud;cart=[];}meta.syncedRevision=state.revision;meta.etag=remote.etag;meta.lastSync=new Date().toISOString();saveMeta();render();return;}
 if(remote.etag!==meta.etag){if(remote.state&&JSON.stringify(remote.state)===JSON.stringify(state)){meta.syncedRevision=state.revision;meta.etag=remote.etag;meta.dirty=false;meta.lastSync=new Date().toISOString();saveMeta();return;}conflict=true;toast('هناك نسخة سحابية مختلفة. صدّر بيانات الجهاز ثم اختر الاستعادة المناسبة.',true);return;}
 const snapshot=structuredClone(state);const res=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({etag:meta.etag,state:snapshot}),redirect:'error'});if(res.status===409){conflict=true;throw Error('تعارض مع جهاز آخر؛ لم تُستبدل أي بيانات سحابية');}MF.need(res.ok,'تعذر الحفظ السحابي؛ التغييرات محفوظة محليًا');const ack=await res.json();meta.syncedRevision=snapshot.revision;meta.etag=ack.etag;meta.lastSync=new Date().toISOString();if(state.revision===snapshot.revision)meta.dirty=false;saveMeta();if(ack.archive===false)toast('حُفظت النسخة السحابية الحالية، لكن الأرشيف تعذر؛ نزّل نسخة احتياطية',true);if(meta.dirty)setTimeout(()=>syncCloud(),1800);if(tab==='backup')render();}catch(e){toast(e.message||'تعذر الاتصال؛ الحفظ المحلي مستمر',true);}finally{syncBusy=false;status();}}
async function recoverCloud(key){try{MF.need(location.protocol!=='file:','افتح الرابط المنشور لاستعادة السحابة');MF.need(confirm('ستُستبدل بيانات هذا الجهاز بالنسخة السحابية. نزّل نسخة محلية أولًا. هل تتابع؟'),'تم إلغاء الاستعادة');const revision=state.revision;const res=await fetch(key?'/api/snapshot?key='+encodeURIComponent(key):'/api/state',{cache:'no-store',redirect:'error'});MF.need(res.ok,'تعذر قراءة النسخة السحابية');const data=await res.json();MF.need(state.revision===revision,'تغيّرت البيانات أثناء القراءة؛ حاول مجددًا');const next=MF.validate(data.state);localStorage.setItem(KEY,JSON.stringify(next));state=next;cart=[];meta.etag=data.etag;meta.syncedRevision=key?0:next.revision;meta.dirty=!!key;meta.lastSync=new Date().toISOString();saveMeta();conflict=false;localBlocked=false;render();toast(key?'تم استعادة النسخة السابقة محليًا؛ زامن لاعتمادها':'تم استعادة النسخة السحابية');}catch(e){toast(e.message,true);}}
async function loadCloudHistory(){try{const r=await fetch('/api/history',{cache:'no-store',redirect:'error'});MF.need(r.ok,'تعذر قراءة الأرشيف');const data=await r.json();$('cloudHistory').innerHTML=data.items.length?data.items.map(x=>`<div class="row spacer"><span class="muted">${esc(new Date(x.uploaded).toLocaleString('ar-JO'))}</span><button onclick="recoverCloud('${esc(x.key)}')">استعادة</button></div>`).join(''):'<p class="muted">لا توجد نسخ مزامنة سابقة</p>'; }catch(e){toast(e.message,true);}}
async function handlesDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('momen-fresh-handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function pickFolder(){try{MF.need(window.showDirectoryPicker,'اختيار المجلد يحتاج Chrome أو Edge على الكمبيوتر');dirHandle=await showDirectoryPicker({mode:'readwrite'});const db=await handlesDB();const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(dirHandle,'backup');await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j;});db.close();await backupToFolder(true);render();}catch(e){if(e.name!=='AbortError')toast(e.message||'تعذر اختيار المجلد',true);}}
let folderQueue=Promise.resolve();function backupToFolder(manual=false){folderQueue=folderQueue.catch(()=>{}).then(()=>writeFolderBackup(manual));return folderQueue;}async function writeFolderBackup(manual=false){if(!dirHandle){if(manual)toast('اختر مجلد النسخ أولًا',true);return;}try{let p=await dirHandle.queryPermission({mode:'readwrite'});if(p!=='granted'&&manual)p=await dirHandle.requestPermission({mode:'readwrite'});MF.need(p==='granted','اضغط حفظ نسخة للسماح بالكتابة في المجلد');const snapshot=JSON.stringify(state,null,2);const h=await dirHandle.getFileHandle('Momen-Fresh-'+MF.day()+'.json',{create:true});const w=await h.createWritable();await w.write(snapshot);await w.close();if(manual)toast('تم حفظ النسخة في المجلد المختار');}catch(e){toast('النسخ إلى المجلد لم يتم: '+e.message,true);}}
async function downloadApp(){try{if(location.protocol==='file:'){toast('أنت تستخدم الملف المحلي بالفعل');return;}const r=await fetch('/offline.html',{redirect:'error'});MF.need(r.ok,'تعذر تنزيل البرنامج');download('Momen-Fresh.html',await r.text(),'text/html;charset=utf-8');}catch(e){toast(e.message,true);}}
window.addEventListener('online',()=>{status();syncCloud();});window.addEventListener('offline',status);window.addEventListener('storage',e=>{if(e.key===KEY){conflict=true;toast('تم تغيير البيانات من نافذة أخرى. أعد تحميل هذه الصفحة قبل البيع.',true);status();}});
render();
(async()=>{try{const db=await handlesDB();const r=db.transaction('handles').objectStore('handles').get('backup');r.onsuccess=()=>{dirHandle=r.result||null;db.close();if(tab==='backup')render();};}catch(e){}})();
if(location.protocol!=='file:'){if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if($('offlineStatus'))$('offlineStatus').textContent='النسخة دون اتصال جاهزة على هذا الجهاز.';}).catch(()=>toast('لم تجهز نسخة دون اتصال؛ نزّل الملف المحلي من الحفظ',true));syncCloud();}
if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'read_shop_summary',title:'قراءة حسابات مؤمن فريش',description:'Read daily sales, costs, expenses and inventory without changing data.',inputSchema:{type:'object',properties:{date:{type:'string',pattern:'^\\d{4}-\\d{2}-\\d{2}$'}},required:['date'],additionalProperties:false},annotations:{readOnlyHint:true},execute(input){MF.need(/^\d{4}-\d{2}-\d{2}$/.test(input?.date),'Invalid date');return MF.report(state,input.date);}});}
</script></body></html>
